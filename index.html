<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Under Maintenance - SSVM Mandli</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --slate-50: #f8fafc;
            --slate-100: #f1f5f9;
            --slate-300: #cbd5e1;
            --slate-700: #334155;
            --slate-900: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--slate-50);
            color: var(--slate-900);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .maintenance-card {
            background: white;
            padding: 48px 32px;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid var(--slate-100);
        }

        .icon-container {
            width: 80px;
            height: 80px;
            background-color: #e0e7ff;
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 24px;
            animation: pulse 2s infinite ease-in-out;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.85rem;
            font-weight: 800;
            color: var(--slate-900);
            margin-bottom: 12px;
        }

        p {
            color: var(--slate-700);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .divider {
            height: 1px;
            background-color: var(--slate-100);
            width: 100%;
            margin-bottom: 24px;
        }

        .contact-info {
            font-size: 0.85rem;
            color: var(--slate-700);
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .contact-item i {
            color: var(--primary);
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 0 15px rgba(79, 70, 229, 0);
            }
        }
    </style>
</head>
<body>
    <div class="maintenance-card">
        <div class="icon-container">
            <i class="fa-solid fa-screwdriver-wrench"></i>
        </div>
        <h1>Portal Under Maintenance</h1>
        <p>The student directory and reports portal is temporarily unavailable. We are performing routine database updates. Please check back later.</p>
        
        <div class="divider"></div>
        
        <div class="contact-info">
            <div class="contact-item">
                <i class="fa-solid fa-envelope"></i>
                <span>ssvmorg@gmail.com</span>
            </div>
            <div class="contact-item">
                <i class="fa-solid fa-phone"></i>
                <span>+91 7976545260</span>
            </div>
        </div>
    </div>
</body>
</html>
